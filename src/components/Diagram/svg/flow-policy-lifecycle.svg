<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Policy lifecycle: a provider creates a grant in the policy service, which stores it and its event in one transaction via the outbox; the event travels through RabbitMQ into the authorization graph; the data plane checks that graph on every request; revocation follows the same pipeline and turns to deny within moments.">
  <defs>
    <marker id="fp-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/>
    </marker>
    <marker id="fp-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/>
    </marker>
    <marker id="fp-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/>
    </marker>
    <marker id="fp-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-green"/>
    </marker>
    <marker id="fp-b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-berry"/>
    </marker>
  </defs>

  <!-- paths -->
  <path id="p-create" class="dxf orange dim" marker-end="url(#fp-o)" d="M172,60 H276"/>
  <text id="lbl-create" class="dxe orange dim" x="184" y="50">create policy</text>
  <path id="p-revoke" class="dxf berry dashed dim" marker-end="url(#fp-b)" d="M172,82 C220,94 236,92 278,86"/>
  <text id="lbl-revoke" class="dxe berry dim" x="196" y="106">revoke</text>
  <path id="p-outbox" class="dxf teal dim" marker-end="url(#fp-t)" d="M358,98 C360,118 360,128 360,146"/>
  <text id="lbl-outbox" class="dxe teal dim" x="372" y="128">one transaction</text>
  <path id="p-pub" class="dxf teal dim" marker-end="url(#fp-t)" d="M422,172 C458,172 474,172 516,172"/>
  <text id="lbl-pub" class="dxe teal dim" x="428" y="162">policy.created / .deleted</text>
  <path id="p-consume" class="dxf teal dim" marker-end="url(#fp-t)" d="M590,198 C592,222 592,232 592,256"/>
  <text id="lbl-consume" class="dxe teal dim" x="604" y="230">consume · idempotent</text>
  <path id="p-serve" class="dxf orange dim" marker-end="url(#fp-o)" d="M172,340 H276"/>
  <text id="lbl-serve" class="dxe orange dim" x="192" y="331">request</text>
  <path id="p-data" class="dxf green dashed dim" marker-end="url(#fp-g)" d="M278,362 C240,368 214,368 174,362"/>
  <text id="lbl-data" class="dxe green dim" x="198" y="384">data</text>
  <path id="p-check" class="dxf navy dashed dim" marker-end="url(#fp-n)" d="M434,332 C470,322 486,308 514,296"/>
  <text id="lbl-check" class="dxe navy dim" x="446" y="318">allowed?</text>
  <path id="p-deny" class="dxf berry dashed dim" marker-end="url(#fp-b)" d="M514,308 C480,326 462,340 436,350"/>
  <text id="lbl-deny" class="dxe berry dim" x="452" y="366">403 within moments</text>

  <!-- nodes -->
  <g id="n-provider" class="dxn orange">
    <rect class="dxn-box" x="30" y="38" width="142" height="52" rx="12"/>
    <text class="dxn-t" x="101" y="60">Provider</text>
    <text class="dxn-s" x="101" y="76">or org admin</text>
  </g>
  <g id="n-acl" class="dxn navy">
    <rect class="dxn-box" x="278" y="38" width="160" height="56" rx="12"/>
    <text class="dxn-t" x="358" y="62">Policy Service</text>
    <text class="dxn-s" x="358" y="78">validate · store</text>
  </g>
  <g id="n-outbox" class="dxn teal dxn-store">
    <rect class="dxn-box" x="300" y="148" width="122" height="46" rx="12"/>
    <text class="dxn-t" x="361" y="168">Outbox</text>
    <text class="dxn-s" x="361" y="182">event rows</text>
  </g>
  <g id="n-mq" class="dxn teal dxn-store">
    <rect class="dxn-box" x="518" y="148" width="140" height="46" rx="12"/>
    <text class="dxn-t" x="588" y="168">RabbitMQ</text>
    <text class="dxn-s" x="588" y="182">authz exchange</text>
  </g>
  <g id="n-az" class="dxn navy">
    <rect class="dxn-box" x="516" y="258" width="152" height="52" rx="12"/>
    <text class="dxn-t" x="592" y="280">Authorization</text>
    <text class="dxn-s" x="592" y="296">openfga tuples</text>
  </g>
  <g id="n-dp" class="dxn green">
    <rect class="dxn-box" x="278" y="316" width="156" height="52" rx="12"/>
    <text class="dxn-t" x="356" y="338">Data Plane</text>
    <text class="dxn-s" x="356" y="354">checks every request</text>
  </g>
  <g id="n-consumer" class="dxn orange">
    <rect class="dxn-box" x="30" y="316" width="142" height="52" rx="12"/>
    <text class="dxn-t" x="101" y="338">Consumer</text>
    <text class="dxn-s" x="101" y="354">granted access</text>
  </g>
</svg>
