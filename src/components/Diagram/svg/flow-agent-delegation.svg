<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Agent delegation flow: a user delegates to an agent, the grant is recorded in the policy service and projected into the authorization graph, the runtime exchanges the user's token for a delegated token, the MCP gateway validates the proposed tool, the API gateway checks the user's and the agent's permission together, high-risk actions park for human approval, and the delegation can be revoked or the agent suspended outright.">
  <defs>
    <marker id="fd-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/>
    </marker>
    <marker id="fd-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/>
    </marker>
    <marker id="fd-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/>
    </marker>
    <marker id="fd-b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-berry"/>
    </marker>
  </defs>

  <!-- paths -->
  <path id="p-delegate" class="dxf orange dim" marker-end="url(#fd-o)" d="M172,64 H246"/>
  <text id="lbl-delegate" class="dxe orange dim" x="188" y="54">delegate</text>

  <path id="p-record" class="dxf teal dim" marker-end="url(#fd-t)" d="M422,64 H496"/>
  <text id="lbl-record" class="dxe teal dim" x="430" y="54">record grant</text>

  <path id="p-project" class="dxf teal dim" marker-end="url(#fd-t)" d="M585,96 V146"/>
  <text id="lbl-project" class="dxe teal dim" x="595" y="124">events · projected</text>

  <path id="p-exchange" class="dxf orange dashed dim" marker-end="url(#fd-o)" d="M100,248 C100,204 178,182 246,176"/>
  <text id="lbl-exchange" class="dxe orange dim" x="104" y="208">token exchange</text>

  <path id="p-tool" class="dxf navy dim" marker-end="url(#fd-n)" d="M172,276 H246"/>
  <text id="lbl-tool" class="dxe navy dim" x="188" y="266">tool call</text>

  <path id="p-gate" class="dxf navy dim" marker-end="url(#fd-n)" d="M422,276 H496"/>
  <text id="lbl-gate" class="dxe navy dim" x="432" y="266">delegated</text>

  <path id="p-check" class="dxf navy dim" marker-end="url(#fd-n)" d="M585,248 V208"/>
  <text id="lbl-check" class="dxe navy dim" x="595" y="232">user ∧ agent</text>

  <path id="p-serve" class="dxf green dim" marker-end="url(#fd-n)" d="M585,304 V344"/>
  <text id="lbl-serve" class="dxe green dim" x="595" y="330">authorized</text>

  <path id="p-approve" class="dxf berry dashed dim" marker-end="url(#fd-b)" d="M300,248 C258,204 152,124 132,98"/>
  <text id="lbl-approve" class="dxe berry dim" x="150" y="152">approval required</text>

  <path id="p-kill" class="dxf berry dim" marker-end="url(#fd-b)" d="M420,82 C458,140 476,206 494,262"/>
  <text id="lbl-kill" class="dxe berry dim" x="430" y="180">kill switch</text>

  <!-- nodes -->
  <g id="n-user" class="dxn orange">
    <rect class="dxn-box" x="30" y="40" width="142" height="52" rx="12"/>
    <text class="dxn-t" x="101" y="62">User</text>
    <text class="dxn-s" x="101" y="78">delegates · approves</text>
  </g>
  <g id="n-registry" class="dxn berry">
    <rect class="dxn-box" x="250" y="40" width="172" height="52" rx="12"/>
    <text class="dxn-t" x="336" y="62">Agent Registry</text>
    <text class="dxn-s" x="336" y="78">agents · templates</text>
  </g>
  <g id="n-acl" class="dxn navy">
    <rect class="dxn-box" x="498" y="40" width="174" height="52" rx="12"/>
    <text class="dxn-t" x="585" y="62">Policy Service</text>
    <text class="dxn-s" x="585" y="78">the durable grant</text>
  </g>
  <g id="n-idp" class="dxn navy">
    <rect class="dxn-box" x="248" y="150" width="174" height="52" rx="12"/>
    <text class="dxn-t" x="335" y="172">Identity Provider</text>
    <text class="dxn-s" x="335" y="188">user + agent in one token</text>
  </g>
  <g id="n-authz" class="dxn navy">
    <rect class="dxn-box" x="498" y="150" width="174" height="52" rx="12"/>
    <text class="dxn-t" x="585" y="172">Authorization</text>
    <text class="dxn-s" x="585" y="188">two checks, not one</text>
  </g>
  <g id="n-runtime" class="dxn berry">
    <rect class="dxn-box" x="30" y="250" width="142" height="52" rx="12"/>
    <text class="dxn-t" x="101" y="272">Agent Runtime</text>
    <text class="dxn-s" x="101" y="288">plans · never holds keys</text>
  </g>
  <g id="n-mcp" class="dxn berry">
    <rect class="dxn-box" x="250" y="250" width="172" height="52" rx="12"/>
    <text class="dxn-t" x="336" y="272">MCP Gateway</text>
    <text class="dxn-s" x="336" y="288">the only egress</text>
  </g>
  <g id="n-gw" class="dxn navy">
    <rect class="dxn-box" x="498" y="250" width="174" height="52" rx="12"/>
    <text class="dxn-t" x="585" y="272">API Gateway</text>
    <text class="dxn-s" x="585" y="288">same edge as humans</text>
  </g>
  <g id="n-svc" class="dxn green">
    <rect class="dxn-box" x="498" y="346" width="174" height="50" rx="12"/>
    <text class="dxn-t" x="585" y="367">Platform service</text>
    <text class="dxn-s" x="585" y="382">serves · audits both ids</text>
  </g>
</svg>
