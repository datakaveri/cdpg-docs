<svg viewBox="0 0 760 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fa-title fa-desc">
  <title id="fa-title">Authentication and identity propagation flow</title>
  <desc id="fa-desc">The user signs in with Keycloak and sends an OIDC token to the gateway. The gateway validates it against JWKS, obtains its own audience-bound workload token, and sends separate subject and actor context. The service verifies workload caller and subject-asserter authority before authorization.</desc>
  <defs><marker id="fa-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/></marker><marker id="fa-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/></marker><marker id="fa-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/></marker><marker id="fa-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-green"/></marker></defs>
  <path id="p-login" class="dxf orange dim" marker-end="url(#fa-o)" d="M166 62H284"/><text id="lbl-login" class="dxe orange dim" x="190" y="51">OIDC + PKCE</text>
  <path id="p-token" class="dxf orange dashed dim" marker-end="url(#fa-o)" d="M284 84H166"/><text id="lbl-token" class="dxe orange dim" x="188" y="105">user access token</text>
  <path id="p-req" class="dxf orange dim" marker-end="url(#fa-o)" d="M110 94C120 160 216 204 286 210"/><text id="lbl-req" class="dxe orange dim" x="142" y="168">HTTPS + bearer</text>
  <path id="p-jwks" class="dxf navy dashed dim" marker-end="url(#fa-n)" d="M368 184V96"/><text id="lbl-jwks" class="dxe navy dim" x="380" y="142">JWKS validate</text>
  <path id="p-workload" class="dxf teal dim" marker-end="url(#fa-t)" d="M416 184C470 138 500 104 526 92"/><text id="lbl-workload" class="dxe teal dim" x="438" y="132">destination token</text>
  <path id="p-fwd" class="dxf teal dim" marker-end="url(#fa-t)" d="M450 216H584"/><text id="lbl-fwd" class="dxe teal dim" x="463" y="204">workload JWT + subject / actor</text>
  <path id="p-verify" class="dxf green dim" marker-end="url(#fa-g)" d="M654 244V318H456"/><text id="lbl-verify" class="dxe green dim" x="516" y="307">verified principal context</text>
  <g id="n-user" class="dxn orange"><rect class="dxn-box" x="30" y="42" width="136" height="52" rx="11"/><text class="dxn-t" x="98" y="63">User</text><text class="dxn-s" x="98" y="79">browser · application</text></g>
  <g id="n-idp" class="dxn navy"><rect class="dxn-box" x="286" y="38" width="164" height="58" rx="11"/><text class="dxn-t" x="368" y="61">Keycloak</text><text class="dxn-s" x="368" y="77">identity + token issuer</text><text class="dx-status impl" x="368" y="91">IMPLEMENTED</text></g>
  <g id="n-gw" class="dxn navy"><rect class="dxn-box" x="286" y="184" width="164" height="64" rx="11"/><text class="dxn-t" x="368" y="207">Gateway</text><text class="dxn-s" x="368" y="223">validate · normalize</text><text class="dx-status partial" x="368" y="242">PARTIAL</text></g>
  <g id="n-svc" class="dxn green"><rect class="dxn-box" x="584" y="184" width="146" height="64" rx="11"/><text class="dxn-t" x="657" y="207">Destination service</text><text class="dxn-s" x="657" y="223">caller + subject asserter</text><text class="dx-status partial" x="657" y="242">PARTIAL</text></g>
  <g id="n-authz" class="dxn navy"><rect class="dxn-box" x="286" y="318" width="170" height="58" rx="11"/><text class="dxn-t" x="371" y="340">Authorization follows</text><text class="dxn-s" x="371" y="356">identity is not permission</text><text class="dx-status partial" x="371" y="371">COMPOSITE TARGET</text></g>
</svg>
