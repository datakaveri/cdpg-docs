<svg viewBox="0 0 760 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fd-title fd-desc">
  <title id="fd-title">Data access and download flow</title>
  <desc id="fd-desc">A consumer discovers a resource, obtains a grant, and the grant is projected through RabbitMQ. The gateway requests a composite authorization decision and sends a carried decision to the Data Plane. The Data Plane validates and enforces filters or masks, delivers data, and emits audit events.</desc>
  <defs><marker id="fd-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/></marker><marker id="fd-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/></marker><marker id="fd-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/></marker><marker id="fd-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-green"/></marker></defs>
  <path id="p-disc" class="dxf orange dim" marker-end="url(#fd-o)" d="M166 72H270"/><text id="lbl-disc" class="dxe orange dim" x="188" y="61">discover metadata</text>
  <path id="p-reqacc" class="dxf orange dim" marker-end="url(#fd-o)" d="M166 146H270"/><text id="lbl-reqacc" class="dxe orange dim" x="190" y="135">obtain grant</text>
  <path id="p-event" class="dxf teal dim" marker-end="url(#fd-t)" d="M430 146H492"/><text id="lbl-event" class="dxe teal dim" x="434" y="135">policy event</text>
  <path id="p-write" class="dxf teal dim" marker-end="url(#fd-t)" d="M568 172V236"/><text id="lbl-write" class="dxe teal dim" x="579" y="207">projection</text>
  <path id="p-query" class="dxf green dim" marker-end="url(#fd-g)" d="M166 326H286"/><text id="lbl-query" class="dxe green dim" x="194" y="315">query / download</text>
  <path id="p-check" class="dxf navy dim" marker-end="url(#fd-n)" d="M368 294C430 262 470 260 492 266"/><text id="lbl-check" class="dxe navy dim" x="394" y="268">composite decision</text>
  <path id="p-carry" class="dxf navy dim" marker-end="url(#fd-n)" d="M450 326H572"/><text id="lbl-carry" class="dxe navy dim" x="462" y="315">carried obligations</text>
  <path id="p-resp" class="dxf green dashed dim" marker-end="url(#fd-g)" d="M572 356C440 410 288 410 166 350"/><text id="lbl-resp" class="dxe green dim" x="312" y="408">filtered result / scoped object</text>
  <path id="p-audit" class="dxf teal dim" marker-end="url(#fd-t)" d="M652 378V442"/><text id="lbl-audit" class="dxe teal dim" x="664" y="414">audit event</text>
  <g id="n-consumer" class="dxn orange"><rect class="dxn-box" x="30" y="54" width="136" height="320" rx="14"/><text class="dxn-t" x="98" y="207">Consumer</text><text class="dxn-s" x="98" y="224">discover · request · use</text></g>
  <g id="n-cat" class="dxn navy"><rect class="dxn-box" x="270" y="48" width="160" height="50" rx="11"/><text class="dxn-t" x="350" y="69">Catalogue</text><text class="dxn-s" x="350" y="84">resource + access modes</text></g>
  <g id="n-acl" class="dxn navy"><rect class="dxn-box" x="270" y="122" width="160" height="54" rx="11"/><text class="dxn-t" x="350" y="143">Policy Service</text><text class="dxn-s" x="350" y="158">grant + outbox</text><text class="dx-status impl" x="350" y="172">IMPLEMENTED</text></g>
  <g id="n-mq" class="dxn teal dxn-store"><rect class="dxn-box" x="492" y="122" width="152" height="50" rx="11"/><text class="dxn-t" x="568" y="143">RabbitMQ</text><text class="dxn-s" x="568" y="158">versioned events</text></g>
  <g id="n-az" class="dxn navy"><rect class="dxn-box" x="492" y="236" width="152" height="62" rx="11"/><text class="dxn-t" x="568" y="258">Authorization</text><text class="dxn-s" x="568" y="274">OpenFGA + planned OPA</text><text class="dx-status partial" x="568" y="292">PARTIAL</text></g>
  <g id="n-gw" class="dxn navy"><rect class="dxn-box" x="286" y="294" width="164" height="64" rx="11"/><text class="dxn-t" x="368" y="316">Gateway / app PEP</text><text class="dxn-s" x="368" y="332">resolve · decide · carry</text><text class="dx-status partial" x="368" y="352">PARTIAL</text></g>
  <g id="n-dp" class="dxn green"><rect class="dxn-box" x="572" y="316" width="158" height="64" rx="11"/><text class="dxn-t" x="651" y="338">Data executor</text><text class="dxn-s" x="651" y="354">verify · filter · deliver</text><text class="dx-status partial" x="651" y="374">PARTIAL</text></g>
  <g id="n-audit" class="dxn teal"><rect class="dxn-box" x="572" y="442" width="158" height="48" rx="11"/><text class="dxn-t" x="651" y="462">Audit Service</text><text class="dxn-s" x="651" y="478">decision + outcome</text></g>
</svg>
