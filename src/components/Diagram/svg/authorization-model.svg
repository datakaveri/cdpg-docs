<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Authorization model: a provider authors a grant in the policy service, which is the durable record; the grant is published transactionally and projected into the relationship graph; the authorization service decides using the relationship plus the grant's own conditions; and the decision is enforced at the gateway, in the service, or inside the data plane, wherever there is enough context.">
  <defs>
    <marker id="am-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/>
    </marker>
    <marker id="am-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/>
    </marker>
    <marker id="am-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/>
    </marker>
  </defs>

  <!-- zones -->
  <rect class="dxz navy" x="16" y="112" width="172" height="200" rx="16"/>
  <text class="dxz-lbl navy" x="32" y="134">pap · the record</text>
  <rect class="dxz navy" x="234" y="112" width="232" height="200" rx="16"/>
  <text class="dxz-lbl navy" x="250" y="134">pdp · the decision</text>
  <rect class="dxz green" x="514" y="30" width="232" height="282" rx="16"/>
  <text class="dxz-lbl green" x="530" y="52">pep · the enforcement</text>

  <!-- flows -->
  <path class="dxf orange calm" marker-end="url(#am-o)" d="M100,94 V144"/>
  <text class="dxe" x="110" y="124">grants access</text>

  <path class="dxf teal calm" marker-end="url(#am-t)" d="M100,206 V246"/>
  <text class="dxe" x="110" y="230">outbox · one tx</text>

  <path class="dxf teal calm" marker-end="url(#am-t)" d="M172,276 H246"/>
  <text class="dxe" x="180" y="266">projected</text>

  <path class="dxf navy dashed calm" marker-end="url(#am-n)" d="M350,246 V216"/>
  <text class="dxe" x="360" y="236">relationships</text>

  <path class="dxf navy calm" marker-end="url(#am-n)" d="M452,180 H526"/>
  <text class="dxe" x="452" y="170">+ obligations</text>

  <!-- author -->
  <g id="n-provider" class="dxn orange">
    <rect class="dxn-box" x="30" y="40" width="142" height="52" rx="12"/>
    <text class="dxn-t" x="101" y="62">Provider</text>
    <text class="dxn-s" x="101" y="78">or org admin</text>
  </g>

  <!-- pap -->
  <g id="n-pap" class="dxn navy">
    <rect class="dxn-box" x="30" y="148" width="142" height="58" rx="12"/>
    <text class="dxn-t" x="101" y="171">Policy Service</text>
    <text class="dxn-s" x="101" y="187">expiry · constraints</text>
  </g>
  <g id="n-mq" class="dxn teal dxn-store">
    <rect class="dxn-box" x="30" y="250" width="142" height="52" rx="12"/>
    <text class="dxn-t" x="101" y="271">Messaging</text>
    <text class="dxn-s" x="101" y="287">at-least-once</text>
  </g>

  <!-- pdp -->
  <g id="n-pdp" class="dxn navy">
    <rect class="dxn-box" x="250" y="148" width="200" height="68" rx="12"/>
    <text class="dxn-t" x="350" y="173">Authorization</text>
    <text class="dxn-s" x="350" y="189">relationship + conditions</text>
    <text class="dxn-s" x="350" y="203">expiry on its own clock</text>
  </g>
  <g id="n-graph" class="dxn navy dxn-store">
    <rect class="dxn-box" x="250" y="250" width="200" height="52" rx="12"/>
    <text class="dxn-t" x="350" y="271">Relationship graph</text>
    <text class="dxn-s" x="350" y="287">users · orgs · groups · agents</text>
  </g>

  <!-- peps -->
  <g id="n-gw" class="dxn green">
    <rect class="dxn-box" x="530" y="64" width="200" height="52" rx="12"/>
    <text class="dxn-t" x="630" y="85">API Gateway</text>
    <text class="dxn-s" x="630" y="101">coarse · early rejection</text>
  </g>
  <g id="n-svc" class="dxn green">
    <rect class="dxn-box" x="530" y="150" width="200" height="52" rx="12"/>
    <text class="dxn-t" x="630" y="171">Service</text>
    <text class="dxn-s" x="630" y="187">resolves the real resource</text>
  </g>
  <g id="n-dp" class="dxn green">
    <rect class="dxn-box" x="530" y="236" width="200" height="52" rx="12"/>
    <text class="dxn-t" x="630" y="257">Data plane</text>
    <text class="dxn-s" x="630" y="273">rows · fields · volume</text>
  </g>
</svg>
