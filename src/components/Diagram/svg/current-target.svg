<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ct-title ct-desc">
  <title id="ct-title">Current and target architecture status</title>
  <desc id="ct-desc">The current pre-first-release platform has partially implemented edge, Control Plane, Data Plane, workload identity, and shared platform; Agentic Plane and Kubernetes deployment are in development. The target adds composite OpenFGA and OPA authorization, carried obligations, hardened all-plane operations, complete GitOps, and deferred federation.</desc>
  <defs><marker id="ct-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/></marker></defs>
  <rect class="dxz orange" x="20" y="30" width="330" height="410" rx="16"/><text class="dxz-lbl orange" x="40" y="54">current · 9 aug 2026</text>
  <rect class="dxz green" x="410" y="30" width="330" height="410" rx="16"/><text class="dxz-lbl green" x="430" y="54">target · intended complete system</text>
  <path class="dxf navy calm" marker-end="url(#ct-n)" d="M350 236H410"/><text class="dxe" x="357" y="223">delivery gates</text>
  <g class="dxn navy"><rect class="dxn-box" x="44" y="78" width="282" height="54" rx="11"/><text class="dxn-t" x="185" y="99">Edge + Control Plane</text><text class="dxn-s" x="185" y="115">core APIs · OpenFGA · policy events</text><text class="dx-status partial" x="185" y="128">PARTIALLY IMPLEMENTED</text></g>
  <g class="dxn green"><rect class="dxn-box" x="44" y="152" width="282" height="54" rx="11"/><text class="dxn-t" x="185" y="173">Data Plane</text><text class="dxn-s" x="185" y="189">NGSI-LD · OGC · files · subscriptions</text><text class="dx-status partial" x="185" y="202">PARTIALLY IMPLEMENTED</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="44" y="226" width="282" height="54" rx="11"/><text class="dxn-t" x="185" y="247">Workload identity + gRPC</text><text class="dxn-s" x="185" y="263">foundations adopted unevenly</text><text class="dx-status planned" x="185" y="276">IN DEVELOPMENT</text></g>
  <g class="dxn berry"><rect class="dxn-box" x="44" y="300" width="282" height="54" rx="11"/><text class="dxn-t" x="185" y="321">Agentic Plane</text><text class="dxn-s" x="185" y="337">local flow · not in GitOps</text><text class="dx-status planned" x="185" y="350">IN DEVELOPMENT</text></g>
  <g class="dxn teal"><rect class="dxn-box" x="44" y="374" width="282" height="46" rx="11"/><text class="dxn-t" x="185" y="395">Pre-first-release</text><text class="dxn-s" x="185" y="411">no production users served</text></g>

  <g class="dxn green"><rect class="dxn-box" x="434" y="78" width="282" height="54" rx="11"/><text class="dxn-t" x="575" y="99">Composite authorization</text><text class="dxn-s" x="575" y="115">OpenFGA relationships + OPA context</text><text class="dx-status planned" x="575" y="128">PLANNED</text></g>
  <g class="dxn green"><rect class="dxn-box" x="434" y="152" width="282" height="54" rx="11"/><text class="dxn-t" x="575" y="173">Carried decisions</text><text class="dxn-s" x="575" y="189">filters · masks · quotas · audit</text><text class="dx-status planned" x="575" y="202">PLANNED</text></g>
  <g class="dxn green"><rect class="dxn-box" x="434" y="226" width="282" height="54" rx="11"/><text class="dxn-t" x="575" y="247">All-plane operational proof</text><text class="dxn-s" x="575" y="263">reconciliation · revocation · failure tests</text><text class="dx-status planned" x="575" y="276">PLANNED / IN DEVELOPMENT</text></g>
  <g class="dxn green"><rect class="dxn-box" x="434" y="300" width="282" height="54" rx="11"/><text class="dxn-t" x="575" y="321">Production GitOps</text><text class="dxn-s" x="575" y="337">routes · secrets · SLOs · Agentic Plane</text><text class="dx-status planned" x="575" y="350">IN DEVELOPMENT</text></g>
  <g class="dxn green deferred"><rect class="dxn-box" x="434" y="374" width="282" height="46" rx="11"/><text class="dxn-t" x="575" y="395">Federated extension</text><text class="dxn-s" x="575" y="411">cross-domain trust and conformance</text><text class="dx-status deferred" x="575" y="417">DEFERRED</text></g>
</svg>
