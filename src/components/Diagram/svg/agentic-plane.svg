<svg viewBox="0 0 760 570" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ap-title ap-desc">
  <title id="ap-title">Agentic Plane lifecycle and governed execution</title>
  <desc id="ap-desc">An owner registers an agent and delegates narrow authority. Runtime creates sessions and obtains a delegated token. MCP Gateway validates tools, runs semantic and authorization checks, and waits for human approval where required. Approved actions use the normal API gateway and services. Audit and kill-switch events span the lifecycle.</desc>
  <defs><marker id="ap-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/></marker><marker id="ap-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/></marker><marker id="ap-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-green"/></marker><marker id="ap-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/></marker><marker id="ap-b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-berry"/></marker></defs>
  <rect class="dxz orange" x="20" y="24" width="168" height="518" rx="16"/><text class="dxz-lbl orange" x="38" y="47">human control</text>
  <rect class="dxz berry" x="212" y="24" width="330" height="518" rx="16"/><text class="dxz-lbl berry" x="232" y="47">agentic plane · in development</text>
  <rect class="dxz navy" x="566" y="24" width="174" height="518" rx="16"/><text class="dxz-lbl navy" x="586" y="47">platform boundary</text>
  <path class="dxf orange calm" marker-end="url(#ap-o)" d="M166 92H238"/><path class="dxf orange calm" marker-end="url(#ap-o)" d="M166 208H238"/>
  <path class="dxf berry calm" marker-end="url(#ap-b)" d="M320 124V184"/><path class="dxf navy calm" marker-end="url(#ap-n)" d="M424 218H590"/>
  <path class="dxf berry calm" marker-end="url(#ap-b)" d="M320 252V316"/><path class="dxf navy calm" marker-end="url(#ap-n)" d="M424 350H590"/>
  <path class="dxf orange dashed calm" marker-end="url(#ap-o)" d="M320 380C260 412 210 438 166 452"/><path class="dxf green calm" marker-end="url(#ap-g)" d="M424 420H590"/>
  <path class="dxf teal dashed calm" marker-end="url(#ap-t)" d="M590 480H424"/><path class="dxf berry dashed calm" marker-end="url(#ap-b)" d="M238 106C206 280 234 428 278 488"/>
  <text class="dxe" x="177" y="82">register / delegate</text><text class="dxe" x="438" y="207">identity + composite check</text><text class="dxe" x="432" y="339">tool decision</text><text class="dxe" x="190" y="431">HITL exact action</text><text class="dxe" x="454" y="409">approved sole egress</text><text class="dxe" x="447" y="500">audit outcome</text><text class="dxe" x="210" y="310">kill switch</text>

  <g class="dxn orange"><rect class="dxn-box" x="40" y="70" width="126" height="50" rx="11"/><text class="dxn-t" x="103" y="91">Owner</text><text class="dxn-s" x="103" y="107">register · revoke</text></g>
  <g class="dxn orange"><rect class="dxn-box" x="40" y="186" width="126" height="50" rx="11"/><text class="dxn-t" x="103" y="207">Approver</text><text class="dxn-s" x="103" y="223">approve · reject</text></g>
  <g class="dxn orange"><rect class="dxn-box" x="40" y="430" width="126" height="50" rx="11"/><text class="dxn-t" x="103" y="451">Human control</text><text class="dxn-s" x="103" y="467">exact action · expiry</text></g>

  <g class="dxn berry"><rect class="dxn-box" x="238" y="70" width="186" height="54" rx="11"/><text class="dxn-t" x="331" y="91">Agent Registry</text><text class="dxn-s" x="331" y="106">identity · template · lifecycle</text><text class="dx-status planned" x="331" y="120">IN DEVELOPMENT</text></g>
  <g class="dxn berry"><rect class="dxn-box" x="238" y="184" width="186" height="68" rx="11"/><text class="dxn-t" x="331" y="205">Agent Runtime</text><text class="dxn-s" x="331" y="220">session · lease · plan · SSE</text><text class="dxn-s" x="331" y="234">delegated token exchange</text><text class="dx-status planned" x="331" y="248">IN DEVELOPMENT</text></g>
  <g class="dxn berry"><rect class="dxn-box" x="238" y="316" width="186" height="68" rx="11"/><text class="dxn-t" x="331" y="337">MCP Gateway</text><text class="dxn-s" x="331" y="352">schema · scope · semantic firewall</text><text class="dxn-s" x="331" y="366">risk · approval · credential</text><text class="dx-status planned" x="331" y="380">IN DEVELOPMENT</text></g>
  <g class="dxn teal"><rect class="dxn-box" x="238" y="456" width="186" height="54" rx="11"/><text class="dxn-t" x="331" y="477">Activity / audit chain</text><text class="dxn-s" x="331" y="492">subject · actor · tool · outcome</text><text class="dx-status partial" x="331" y="506">PARTIAL</text></g>

  <g class="dxn navy"><rect class="dxn-box" x="590" y="70" width="126" height="54" rx="11"/><text class="dxn-t" x="653" y="91">Keycloak</text><text class="dxn-s" x="653" y="106">agent/workload identity</text><text class="dx-status partial" x="653" y="120">PARTIAL</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="590" y="184" width="126" height="54" rx="11"/><text class="dxn-t" x="653" y="205">Policy + PDP</text><text class="dxn-s" x="653" y="220">user ∩ agent ∩ context</text><text class="dx-status partial" x="653" y="234">PARTIAL</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="590" y="316" width="126" height="54" rx="11"/><text class="dxn-t" x="653" y="337">API Gateway</text><text class="dxn-s" x="653" y="352">normal PEP + kill switch</text><text class="dx-status partial" x="653" y="366">PARTIAL</text></g>
  <g class="dxn green"><rect class="dxn-box" x="590" y="398" width="126" height="54" rx="11"/><text class="dxn-t" x="653" y="419">Platform service</text><text class="dxn-s" x="653" y="434">enforce · side effect</text><text class="dx-status partial" x="653" y="448">VARIES</text></g>
  <g class="dxn teal"><rect class="dxn-box" x="590" y="472" width="126" height="42" rx="11"/><text class="dxn-t" x="653" y="492">Audit Service</text><text class="dx-status impl" x="653" y="508">IMPLEMENTED</text></g>
</svg>
