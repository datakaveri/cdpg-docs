<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="Agentic plane: a user asks an agent; the agent runtime proposes a tool, the MCP gateway validates and attaches a delegated credential, and the request enters the platform through the same API gateway as human traffic, where authorization checks the user's permission and the agent's delegated permission together. The agent registry records delegations in the policy service and operates the kill switch.">
  <defs>
    <marker id="ap-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/>
    </marker>
    <marker id="ap-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/>
    </marker>
    <marker id="ap-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/>
    </marker>
    <marker id="ap-b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M1 1l5 2.5-5 2.5z" class="dx-arr-berry"/>
    </marker>
  </defs>

  <!-- zones -->
  <rect class="dxz berry" x="210" y="24" width="250" height="252" rx="16"/>
  <text class="dxz-lbl berry" x="228" y="46">agent plane · optional</text>

  <!-- flows -->
  <path class="dxf orange calm" marker-end="url(#ap-o)" d="M172,72 C196,74 206,80 224,84"/>
  <text class="dxe" x="180" y="64">asks</text>

  <path class="dxf navy calm" marker-end="url(#ap-n)" d="M335,118 V138"/>
  <text class="dxe" x="345" y="132">proposed tool</text>

  <path class="dxf navy calm" marker-end="url(#ap-n)" d="M445,168 H506"/>
  <text class="dxe" x="452" y="160">delegated</text>

  <path class="dxf navy calm" marker-end="url(#ap-n)" d="M615,140 V116"/>
  <text class="dxe" x="625" y="130">authorized call</text>

  <path class="dxf navy calm" marker-end="url(#ap-n)" d="M600,200 C598,220 601,234 605,246"/>
  <text class="dxe" x="516" y="228">user ∧ agent</text>

  <path class="dxf teal calm" marker-end="url(#ap-t)" d="M615,328 V306"/>
  <text class="dxe" x="625" y="320">delegation grants</text>

  <path class="dxf teal calm" marker-end="url(#ap-t)" d="M445,250 C480,272 490,302 506,338"/>
  <text class="dxe" x="440" y="316">records delegation</text>

  <path class="dxf berry calm" marker-end="url(#ap-b)" d="M445,232 C470,220 482,212 506,202"/>
  <text class="dxe" x="446" y="214">kill switch</text>

  <!-- caller -->
  <g id="n-user" class="dxn orange">
    <rect class="dxn-box" x="30" y="40" width="142" height="52" rx="12"/>
    <text class="dxn-t" x="101" y="62">User</text>
    <text class="dxn-s" x="101" y="78">delegates · approves</text>
  </g>

  <!-- agent plane -->
  <g id="n-runtime" class="dxn berry">
    <rect class="dxn-box" x="228" y="60" width="215" height="56" rx="12"/>
    <text class="dxn-t" x="335" y="83">Agent Runtime</text>
    <text class="dxn-s" x="335" y="99">sessions · plan loop · streaming</text>
  </g>
  <g id="n-mcp" class="dxn berry">
    <rect class="dxn-box" x="228" y="140" width="215" height="56" rx="12"/>
    <text class="dxn-t" x="335" y="163">MCP Gateway</text>
    <text class="dxn-s" x="335" y="179">schema · scope · risk · credential</text>
  </g>
  <g id="n-registry" class="dxn berry">
    <rect class="dxn-box" x="228" y="220" width="215" height="50" rx="12"/>
    <text class="dxn-t" x="335" y="241">Agent Registry</text>
    <text class="dxn-s" x="335" y="257">records · templates · kill switch</text>
  </g>

  <!-- platform -->
  <g id="n-svc" class="dxn green">
    <rect class="dxn-box" x="510" y="60" width="210" height="54" rx="12"/>
    <text class="dxn-t" x="615" y="82">Platform services</text>
    <text class="dxn-s" x="615" y="98">data plane · catalogue · market</text>
  </g>
  <g id="n-gw" class="dxn navy">
    <rect class="dxn-box" x="510" y="140" width="210" height="58" rx="12"/>
    <text class="dxn-t" x="615" y="164">API Gateway</text>
    <text class="dxn-s" x="615" y="180">the same edge as human traffic</text>
  </g>
  <g id="n-authz" class="dxn navy">
    <rect class="dxn-box" x="510" y="248" width="210" height="54" rx="12"/>
    <text class="dxn-t" x="615" y="270">Authorization</text>
    <text class="dxn-s" x="615" y="286">both checks must pass</text>
  </g>
  <g id="n-acl" class="dxn navy">
    <rect class="dxn-box" x="510" y="330" width="210" height="54" rx="12"/>
    <text class="dxn-t" x="615" y="352">Policy Service</text>
    <text class="dxn-s" x="615" y="368">delegations live with grants</text>
  </g>
</svg>
