<svg viewBox="0 0 760 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sa-title sa-desc">
  <title id="sa-title">Complete CDPG platform context</title>
  <desc id="sa-desc">People, applications, agents, and external providers enter through identity and gateway boundaries. Control Plane services govern identity, catalogues, policies, commerce, and platform records. Data Plane services serve NGSI-LD, OGC, file, and subscription data. Agentic Plane services govern delegated execution. Shared infrastructure provides stores, events, and observability. Cards show implementation status.</desc>
  <defs>
    <marker id="sa-o" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-orange"/></marker>
    <marker id="sa-n" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-navy"/></marker>
    <marker id="sa-t" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-teal"/></marker>
    <marker id="sa-g" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M1 1l5 2.5-5 2.5z" class="dx-arr-green"/></marker>
  </defs>

  <text class="dxz-lbl" x="28" y="25">external actors &amp; dependencies</text>
  <rect class="dxz navy" x="20" y="108" width="720" height="92" rx="16"/>
  <text class="dxz-lbl navy" x="38" y="130">public trust boundary</text>
  <rect class="dxz navy" x="20" y="232" width="350" height="248" rx="16"/>
  <text class="dxz-lbl navy" x="38" y="255">control plane</text>
  <rect class="dxz green" x="390" y="232" width="350" height="248" rx="16"/>
  <text class="dxz-lbl green" x="408" y="255">data plane</text>
  <rect class="dxz berry" x="20" y="506" width="720" height="88" rx="16"/>
  <text class="dxz-lbl berry" x="38" y="529">agentic plane · in development</text>
  <rect class="dxz teal" x="20" y="620" width="720" height="64" rx="16"/>
  <text class="dxz-lbl teal" x="38" y="643">shared infrastructure &amp; platform operations</text>

  <path class="dxf orange calm" marker-end="url(#sa-o)" d="M118 80V145H250"/>
  <path class="dxf orange calm" marker-end="url(#sa-o)" d="M316 80V145"/>
  <path class="dxf orange calm" marker-end="url(#sa-o)" d="M608 80V145H510"/>
  <path class="dxf navy calm" marker-end="url(#sa-n)" d="M440 182C360 214 310 220 262 252"/>
  <path class="dxf green calm" marker-end="url(#sa-g)" d="M500 182C560 214 576 220 586 252"/>
  <path class="dxf teal dashed calm" marker-end="url(#sa-t)" d="M278 455C350 492 418 492 486 455"/>
  <path class="dxf navy calm" marker-end="url(#sa-n)" d="M560 530C610 460 610 270 520 184"/>
  <path class="dxf teal calm" marker-end="url(#sa-t)" d="M380 594V628"/>
  <text class="dxe" x="145" y="101">OIDC / HTTPS</text>
  <text class="dxe" x="508" y="101">callbacks / providers</text>
  <text class="dxe" x="323" y="480">events + carried decisions</text>

  <g class="dxn orange"><rect class="dxn-box" x="38" y="38" width="160" height="44" rx="11"/><text class="dxn-t" x="118" y="57">People &amp; applications</text><text class="dxn-s" x="118" y="72">provider · consumer · admin</text></g>
  <g class="dxn orange"><rect class="dxn-box" x="238" y="38" width="156" height="44" rx="11"/><text class="dxn-t" x="316" y="57">Agent clients</text><text class="dxn-s" x="316" y="72">owner · approver</text></g>
  <g class="dxn orange"><rect class="dxn-box" x="522" y="38" width="174" height="44" rx="11"/><text class="dxn-t" x="609" y="57">External systems</text><text class="dxn-s" x="609" y="72">data · payment · email · llm</text></g>

  <g class="dxn navy"><rect class="dxn-box" x="42" y="142" width="180" height="44" rx="11"/><text class="dxn-t" x="132" y="161">Identity Provider</text><text class="dxn-s" x="132" y="176">users · workloads · agents</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="274" y="142" width="208" height="44" rx="11"/><text class="dxn-t" x="378" y="161">API Gateway · PEP</text><text class="dxn-s" x="378" y="176">authenticate · authorize · route</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="534" y="142" width="178" height="44" rx="11"/><text class="dxn-t" x="623" y="161">Provider boundaries</text><text class="dxn-s" x="623" y="176">verified callbacks / sources</text></g>

  <g class="dxn navy"><rect class="dxn-box" x="38" y="274" width="145" height="52" rx="11"/><text class="dxn-t" x="110" y="294">User &amp; Org</text><text class="dxn-s" x="110" y="308">identity-domain records</text><text class="dx-status partial" x="110" y="321">PARTIAL</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="204" y="274" width="145" height="52" rx="11"/><text class="dxn-t" x="276" y="294">Catalogue</text><text class="dxn-s" x="276" y="308">metadata · discovery</text><text class="dx-status partial" x="276" y="321">PARTIAL</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="38" y="344" width="145" height="52" rx="11"/><text class="dxn-t" x="110" y="364">Policy · PAP</text><text class="dxn-s" x="110" y="378">grants · lifecycle</text><text class="dx-status impl" x="110" y="391">IMPLEMENTED</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="204" y="344" width="145" height="52" rx="11"/><text class="dxn-t" x="276" y="364">Authz · PDP</text><text class="dxn-s" x="276" y="378">OpenFGA + planned OPA</text><text class="dx-status partial" x="276" y="391">PARTIAL</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="38" y="414" width="145" height="48" rx="11"/><text class="dxn-t" x="110" y="434">Marketplace</text><text class="dxn-s" x="110" y="449">products · entitlement</text><text class="dx-status partial" x="110" y="459">PARTIAL</text></g>
  <g class="dxn navy"><rect class="dxn-box" x="204" y="414" width="145" height="48" rx="11"/><text class="dxn-t" x="276" y="434">Platform services</text><text class="dxn-s" x="276" y="449">supporting domains</text><text class="dx-status impl" x="276" y="459">IMPLEMENTED</text></g>

  <g class="dxn green"><rect class="dxn-box" x="408" y="274" width="145" height="52" rx="11"/><text class="dxn-t" x="480" y="294">NGSI-LD</text><text class="dxn-s" x="480" y="308">entity · temporal · search</text><text class="dx-status partial" x="480" y="321">PARTIAL</text></g>
  <g class="dxn green"><rect class="dxn-box" x="575" y="274" width="145" height="52" rx="11"/><text class="dxn-t" x="647" y="294">OGC APIs</text><text class="dxn-s" x="647" y="308">features · tiles · processes</text><text class="dx-status partial" x="647" y="321">PARTIAL</text></g>
  <g class="dxn green"><rect class="dxn-box" x="408" y="344" width="145" height="52" rx="11"/><text class="dxn-t" x="480" y="364">File Exchange</text><text class="dxn-s" x="480" y="378">objects · processing</text><text class="dx-status partial" x="480" y="391">PARTIAL</text></g>
  <g class="dxn green"><rect class="dxn-box" x="575" y="344" width="145" height="52" rx="11"/><text class="dxn-t" x="647" y="364">Subscriptions</text><text class="dxn-s" x="647" y="378">definitions · delivery</text><text class="dx-status impl" x="647" y="391">IMPLEMENTED</text></g>
  <g class="dxn green"><rect class="dxn-box" x="408" y="414" width="312" height="48" rx="11"/><text class="dxn-t" x="564" y="434">Enforcement at execution</text><text class="dxn-s" x="564" y="449">verify carried decision · filter · mask · meter · deliver</text><text class="dx-status planned" x="564" y="459">TARGET CONTRACT PLANNED</text></g>

  <g class="dxn berry"><rect class="dxn-box" x="44" y="542" width="190" height="40" rx="11"/><text class="dxn-t" x="139" y="560">Agent Registry</text><text class="dx-status planned" x="139" y="575">IN DEVELOPMENT</text></g>
  <g class="dxn berry"><rect class="dxn-box" x="285" y="542" width="190" height="40" rx="11"/><text class="dxn-t" x="380" y="560">Agent Runtime</text><text class="dx-status planned" x="380" y="575">IN DEVELOPMENT</text></g>
  <g class="dxn berry"><rect class="dxn-box" x="526" y="542" width="190" height="40" rx="11"/><text class="dxn-t" x="621" y="560">MCP Gateway</text><text class="dx-status planned" x="621" y="575">IN DEVELOPMENT</text></g>

  <g class="dxn teal dxn-store"><rect class="dxn-box" x="176" y="646" width="408" height="28" rx="9"/><text class="dxn-t" x="380" y="664">PostgreSQL/PostGIS · Search · Redis · RabbitMQ · S3 · Telemetry</text></g>
</svg>
